name: CI & Accessibility Verification

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (grounding, API, channels, accessibility)
        run: python -m pytest -v

      - name: Fail if secrets are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file is tracked by git. Remove it and rotate any keys it contained."
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t alx-assistant .
